<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>Clew 原型 E · 真实项目</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/shell.css" />
<link rel="stylesheet" href="css/sidebar.css" />

<body>
<div id="top"><b>真实项目</b><div id="trail"></div></div>
<div id="graph"><div id="world"><svg id="edges"></svg></div></div>

<div id="focus"></div>
<div id="hint"><span class="hi" data-icon="enter"></span> 橙色=精确 · 黄=启发式 · 紫=多态 · 灰=未解析 · <span class="hi" data-icon="close"></span> 关闭（引用归零才删） · 类里的方法点开就地展开</div>

<!-- 代码配色主题：只换 token 颜色，先于脚本加载，省掉首帧闪一下 -->
<script src="themes.js"></script>
<!-- 图标：两套同键名的资源，vendor/icons.js 选一套；?icons=antd 可临时换 -->
<script src="vendor/icons-antd.js"></script>
<script src="vendor/icons-material.js"></script>
<script src="vendor/icons.js"></script>
<!-- 行内高亮：本地 vendoring 的 highlight.js，不依赖网络，随 resources 一起打进二进制 -->
<script src="vendor/highlight.min.js"></script>
<!-- 引导：先取数，再动态 import 画布与外壳（module 自己被推迟到解析之后） -->
<script type="module" src="boot.js"></script>
</body>
</html>
