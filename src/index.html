<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Clew 原型 E · 真实项目</title>
<style>
  :root{--bg:#14171c;--card:#1c2128;--bd:#2d333b;--tx:#d7dde5;--dim:#7d8794;
        --acc:#58a6ff;--call:#f0883e;--data:#3fb950;--br:#bc8cff;--sel:#e3b341;
        --heur:#d2a24c;--dead:#4b5563;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);
    font:12.5px/1.55 "Cascadia Mono",Consolas,monospace;overflow:hidden}
  #top{position:fixed;inset:0 0 auto 0;height:42px;display:flex;align-items:center;gap:8px;
    padding:0 12px;background:#0f1216;border-bottom:1px solid var(--bd);z-index:40;overflow-x:auto}
  #top b{color:var(--acc);white-space:nowrap}
  .ent{background:#1f2630;border:1px solid var(--bd);border-radius:4px;padding:1px 7px;
    cursor:pointer;white-space:nowrap;font-size:11px;color:var(--tx)}
  .ent:hover{border-color:var(--acc);color:var(--acc)}
  .ent-select{background:#1f2630;border:1px solid var(--bd);border-radius:4px;
    padding:2px 6px;color:var(--tx);font:inherit;font-size:11px;max-width:46vw}
  .ent-select:hover{border-color:var(--acc)}
  .ent-select:focus{outline:1px solid var(--acc)}
  #trail{display:flex;gap:5px;align-items:center;white-space:nowrap;flex:1;min-width:0;overflow-x:auto}
  #trail span{color:var(--acc);cursor:pointer}
  #trail span.cur{color:var(--sel);font-weight:600}
  #trail i{color:var(--dim);font-style:normal}
  #graph{position:absolute;inset:42px 0 0 0;overflow:auto;cursor:grab;scrollbar-width:none}
  #graph::-webkit-scrollbar{display:none;width:0;height:0}
  body.panning,body.panning *{cursor:grabbing!important;user-select:none}
  #minimap{position:fixed;right:14px;bottom:16px;z-index:30;padding:6px;
    background:#0f1216e6;border:1px solid var(--bd);border-radius:6px;
    box-shadow:0 6px 18px #0007;cursor:pointer;line-height:0}
  #minimap:hover{border-color:var(--acc)}
  #world{position:relative;width:16000px;height:12000px}
  svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

  .card{position:absolute;width:720px;background:var(--card);border:1px solid var(--bd);
    border-radius:8px;box-shadow:0 6px 18px #0006;
    transition:left .18s ease,top .18s ease}
  .card.sel{border-color:var(--sel);box-shadow:0 0 0 3px #e3b34133}
  .head{display:flex;align-items:center;gap:7px;padding:5px 8px;border-bottom:1px solid var(--bd);
    cursor:pointer}
  .head .t{color:var(--acc);font-weight:600;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;flex:1}
  .head .m{color:var(--dim);font-size:10px;white-space:nowrap;max-width:120px;
    overflow:hidden;text-overflow:ellipsis}
  .head .btn{background:#262c34;border:1px solid var(--bd);border-radius:3px;padding:0 5px;
    font-size:10px;color:var(--dim);cursor:pointer}
  .head .btn:hover{color:var(--acc);border-color:var(--acc)}
  .head .btn.pin{font-size:11px;padding:0 4px}
  .head .btn.pin.on{color:var(--sel);border-color:#6b5a1f;background:#2a2313}
  .head .btn.close:hover{color:#f85149;border-color:#f85149}
  .head .hub{background:var(--call);color:#14171c;border-radius:3px;padding:0 4px;font-size:9px}
  .kindbadge{background:#2d333b;color:var(--dim);border-radius:3px;padding:0 4px;font-size:9px}
  .body{padding:3px 0 5px}
  .ln{position:relative;padding:1px 26px 1px 34px;white-space:pre;overflow:hidden;
    text-overflow:ellipsis}
  .ln .txt{display:inline}
  .bind{position:relative;margin:1px 10px 3px 34px;padding:2px 8px;border-left:2px solid var(--data);
    color:var(--data);font-size:11px;background:#11161d;border-radius:0 4px 4px 0;
    white-space:pre-wrap;word-break:break-word;line-height:1.5}
  .bind .p{color:var(--data)}
  .bind .a{color:#e6edf3}
  .bind .sep{color:#4b5563}
  .ln .lnum{position:absolute;left:4px;top:1px;color:#4b5563;font-size:10px;
    -webkit-user-select:none;user-select:none}
  .ln.stmt{color:#c9d1d9}
  .ln.branch{color:var(--br)}
  .ln.call{color:var(--call)}
  /* 语法色：整行仍跟行色走（标点、括号），语义片段各自上色。
     具体色值来自 themes.js，这里只给兜底值 */
  .ln .hljs-keyword{color:var(--hl-kw,#ff7b72)}
  .ln .hljs-string{color:var(--hl-str,#a5d6ff)}
  .ln .hljs-subst{color:var(--hl-num,#79c0ff)}
  .ln .hljs-number{color:var(--hl-num,#79c0ff)}
  .ln .hljs-literal{color:var(--hl-num,#79c0ff)}
  .ln .hljs-title{color:var(--hl-fn,#d2a8ff)}
  .ln .hljs-title.function_{color:var(--hl-fn,#d2a8ff)}
  .ln .hljs-title.class_{color:var(--hl-cls,#ffa657)}
  .ln .hljs-params{color:var(--hl-param,#c9d1d9)}
  .ln .hljs-built_in{color:var(--hl-builtin,#ffa657)}
  .ln .hljs-meta{color:var(--hl-meta,#d2a8ff)}
  .ln .hljs-variable{color:var(--hl-self,#ffa657);font-style:italic}
  .ln .hljs-comment{color:var(--hl-comment,#8b949e);font-style:italic}
  /* 合成的临时量 %N，与源码里的真实变量区分开 */
  .ln .tmp{color:var(--hl-tmp,#7d8794);font-style:italic}
  .ln.more{color:var(--dim);font-style:italic;cursor:pointer}
  .ln.more:hover{color:var(--acc)}
  .ext{border-bottom:1px dotted var(--acc);cursor:help}
  .anchor{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:10px;
    cursor:pointer;z-index:5;color:var(--call);white-space:nowrap}
  .anchor.on{color:var(--sel)}
  .anchor.heur{color:var(--heur);opacity:.85}
  .anchor.poly{color:#bc8cff}
  .anchor.dead{color:var(--dead);cursor:default}
  .anchor.done{color:var(--data)}

  /* 手风琴：类卡片里的方法 */
  .acc{border-top:1px solid #22272e;margin-top:2px}
  .acc-head{display:flex;align-items:center;gap:6px;padding:3px 8px;cursor:pointer;
    color:var(--dim);font-size:11.5px}
  .acc-head:hover{background:#2d333b80;color:var(--acc)}
  .acc-head.sel-row{background:#3a2f14;color:var(--sel)}
  .acc-head.sel-row .nm{color:var(--sel)}
  .card.related{border-color:#a8873555;box-shadow:0 0 0 2px #e3b34122}
  .acc-head .caret{color:var(--acc)}
  .acc-head .nm{color:var(--acc);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acc-head .cnt{color:var(--call);font-size:9.5px}
  .acc-body{padding-left:10px;border-left:2px solid #2d333b;margin-left:10px}
  .hidden-note{padding:3px 10px;color:var(--dim);font-size:10.5px;font-style:italic}

  #bubble{position:fixed;max-width:460px;background:#0f1216;border:1px solid var(--bd);
    border-radius:6px;padding:8px 10px;font-size:11.5px;z-index:60;display:none;
    box-shadow:0 8px 24px #000a}
  #bubble .row{display:flex;gap:8px;padding:1px 0}
  #bubble .k{color:var(--data);min-width:80px}
  #bubble .v{color:#e6edf3;word-break:break-all}
  #bubble .hdr{color:var(--call);margin-bottom:4px}
  #bubble .note{color:var(--dim);border-top:1px solid #22272e;margin-top:5px;padding-top:4px}
  #focus{position:fixed;inset:42px 0 0 0;background:#0b0e12ee;z-index:50;display:none;
    padding:36px;overflow:auto}
  #focus .card{position:relative;left:auto;top:auto;margin:0 auto;width:min(1000px,92vw)}
  #hint{position:fixed;left:12px;bottom:8px;color:var(--dim);font-size:11px;z-index:41}
</style>
</head>
<body>
<div id="top"><b>真实项目</b><div id="trail"></div></div>
<div id="graph"><div id="world"><svg id="edges"></svg></div></div>
<div id="bubble"></div>
<div id="focus"></div>
<div id="hint">◆ 橙色=精确 · 黄=启发式 · 紫=多态 · 灰=未解析 · ✕ 关闭（引用归零才删） · 类里的方法点开就地展开</div>

<!-- 代码配色主题：只换 token 颜色，先于脚本加载，省掉首帧闪一下 -->
<script src="themes.js"></script>
<!-- 行内高亮：本地 vendoring 的 highlight.js，不依赖网络，随 resources 一起打进二进制 -->
<script src="vendor/highlight.min.js"></script>
<script>
  // 数据来自索引库：先打开项目，再一次性取出整张图，最后加载界面脚本。
  // 没有 __TAURI__ 时进浏览器预览：图从同目录的 __clew_graph.json 读（clew export 生成）。
  const api = window.__TAURI__ ? window.__TAURI__.core : null;
  const PREVIEW_DATA = "__clew_graph.json";

  // 启动耗时打点。统一收集在 __CLEW_T，最后一次性打到 console。
  const __CLEW_T = [];
  function mark(name) {
    __CLEW_T.push([name, performance.now()]);
    return performance.now();
  }
  mark("script");
  const tBoot0 = performance.now();
  window.__CLEW_MARK = mark;

  function clewReport() {
    const first = __CLEW_T[0][1];
    const parts = __CLEW_T.map(function (p) {
      return p[0] + "=" + (p[1] - first).toFixed(1);
    });
    const gaps = [];
    for (let i = 1; i < __CLEW_T.length; i++) {
      gaps.push(
        __CLEW_T[i][0] + ":" + (__CLEW_T[i][1] - __CLEW_T[i - 1][1]).toFixed(1)
      );
    }
    console.log("[t] JS " + parts.join(" ") + " | gaps " + gaps.join(" "));
  }
  window.__CLEW_REPORT = clewReport;

  function clewFail(msg) {
    document.body.innerHTML =
      '<pre style="color:#f88;padding:24px;white-space:pre-wrap">' + msg + "</pre>";
    // 报错时窗口可能还藏着，先亮出来，不然用户看到的是什么也没发生
    if (api) api.invoke("ready").catch(function () {});
  }

  window.onerror = function (msg, src, line, col, err) {
    clewFail(msg + "\n" + (src || "") + ":" + line + ":" + col +
             "\n" + ((err && err.stack) || ""));
  };
  window.addEventListener("unhandledrejection", function (ev) {
    clewFail("promise: " + String((ev.reason && ev.reason.stack) || ev.reason));
  });

  function clewGraph() {
    return fetch(PREVIEW_DATA).then(function (r) {
      if (!r.ok) throw new Error("读不到 " + PREVIEW_DATA + "，先跑 clew export");
      return r.json();
    });
  }

  function clewMount(entries) {
    // 桌面模式不再整图传输：入口列表交给 app.js，卡片按展开动作逐个取。
    // 浏览器预览没有后端，仍旧读一份导出的 JSON。
    const ready = api
      ? Promise.resolve()
      : clewGraph().then(function (data) {
          mark("graph-done");
          window.__CLEW__ = data;
          window.__CLEW_PREVIEW__ = true;
        });
    return ready.then(function () {
      window.__CLEW_ENTRIES__ = entries || [];
      window.__CLEW_PREVIEW__ = !api;
      const s = document.createElement("script");
      s.src = "app.js";
      s.onerror = function () {
        clewFail("app.js 加载失败");
      };
      s.onload = function () {
        mark("app-loaded");
        const t = document.createElement("script");
        t.src = "shell.js";
        t.onerror = function () {
          clewFail("shell.js 加载失败");
        };
        t.onload = function () {
          mark("shell-loaded");
          // 外壳的 DOM 已经就位，直接让窗口出现。页面加载完成那边还有一层，
          // 所以这里不猜时间，也不需要等渲染帧。
          if (api) api.invoke("ready").catch(function () {});
        };
        document.body.appendChild(t);
      };
      document.body.appendChild(s);
    });
  }

  function clewBoot() {
    if (!api) return Promise.resolve(null);
    mark("boot-call");
    return api.invoke("boot").then(function (info) {
      mark("boot-done");
      window.__CLEW_BOOT_MS = info && info.boot_ms;
      window.__CLEW_BOOT_INFO__ = info;
      if (info) window.__CLEW_PATH__ = info.root;
      return info;
    });
  }

  clewBoot()
    .then(function (info) { return clewMount(info && info.entries); })
    .catch(clewFail);
</script>
</body>
</html>
